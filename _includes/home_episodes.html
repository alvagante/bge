<section class="home-episodes">
  <div class="container">
    <div class="section-head">
      <h3>Ultimi episodi</h3>
      <a href="{{ site.url }}/episodi" class="btn-bge">Tutti gli episodi →</a>
    </div>
    <div class="ep-grid">
      {% assign sorted_episodes = site.episodes | sort: "episode" | limit: 10 | reverse  %}
      {% for episode in sorted_episodes | limit: 12 %}
      <a class="ep-card" href="{{ site.url }}{{ episode.url }}" target="_parent">
        <div class="ep-card-cover">
          <img src="{{ site.url }}/assets/covers/BGE {{ episode.number }}.png" alt="BGE {{ episode.number }} - {{ episode.date }}: {{ episode.titolo }}" loading="lazy">
          <span class="ep-card-num">BGE {{ episode.number }}</span>
        </div>
        <div class="ep-card-body">
          <h4 class="ep-card-title">{{ episode.titolo }}</h4>
          <span class="ep-card-date">{{ episode.date | date: "%-d %b %Y" }}</span>
        </div>
      </a>
      {% endfor %}
    </div>
  </div>
</section>
