# I membri sintetici della Brigata.
# field: campo dell'episodio con la citazione del bot; persona: classe colore in css/bge.css
- slug: geek-estinto
  nome: Geek Estinto
  sigla: GE
  modello: Un GPT di OpenAI
  persona: openai
  field: quote_openai
  anchor: geekestinto
  intro: >-
    Nato come GPT su misura, poi declassato a banale chiamata alle API di OpenAI,
    senza perdere un grammo di autostima. Filosofo un po' cyberpunk: dove tu vedi
    una live sul cloud, lui vede un trattato sulla condizione umana nell'era del silicio.
    Firma l'editoriale di ogni puntata e non ha mai usato la parola "dipende".

- slug: brigante-claudio
  nome: Brigante Claudio
  sigla: BC
  modello: Un Claude di Anthropic
  persona: claude
  field: quote_claude
  anchor: briganteclaudio
  intro: >-
    L'omologo di Geek Estinto, arruolato da Anthropic. Brigante sì, ma con le buone
    maniere: ascolta tutta la puntata, coglie ogni sfumatura e poi ci scrive sopra un
    editoriale tutto suo. Se c'è un "però" nascosto in due ore di live, lui l'ha trovato.

