description: "L'intelligenza artificiale non sta solo scrivendo righe di codice al\
  \ posto nostro:\nsta ridefinendo da cima a fondo cosa significa \"fare lo sviluppatore\"\
  .\n\nIn questo episodio della Brigata dei Geek Estinti, mettiamo da parte gli allarmismi\
  \ e le illusioni per analizzare come sta cambiando concretamente la professione\
  \ del Dev.\n\nDal ruolo dei Copilot all'avvento degli agenti autonomi, ci chiediamo:\n\
  la sintassi \xE8 davvero diventata obsoleta?\nOggi conta pi\xF9 saper architettare\
  \ un sistema o saper orchestrare un modello generativo?\n\nParleremo di come cambiano\
  \ le competenze richieste, del rischio di pigrizia mentale per le nuove leve e di\
  \ come sopravvivere (e prosperare) in un mercato dove il codice \xE8 diventato una\
  \ commodity.\n\nIn questo episodio:\n- Dalla scrittura al controllo: Perch\xE9 il\
  \ Dev del futuro somiglia sempre pi\xF9 a un Code Reviewer o Product Manager tecnico.\n\
  - Il paradosso dei Junior: Come si impara a programmare quando l'AI fa gi\xE0 il\
  \ lavoro di livello entry-level?\n- Competenze chiave: Architettura, sicurezza,\
  \ dominio di business e prompt engineering avanzato.\n- Strumenti vs Agenzia: Dove\
  \ finisce l'assistente e dove inizia l'automazione totale del workflow."
